[tool.poetry]
name = "gradimize"
version = "0.1.0"
description = "Academic scheduling engine using constraint programming"
authors = ["Gradimize Team"]
readme = "README.md"
# The package is the src/ directory itself (imports are `src.*`); without
# this poetry-core aborts fresh installs with ModuleOrPackageNotFoundError.
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
sqlmodel = "^0.0.22"
fastapi = "^0.115"
uvicorn = "^0.32"
pandas = "^2.2"
networkx = "^3.4"
ortools = "^9.11"
textual = "^0.89"
pyyaml = "^6.0"
pydantic = "^2.9"
python-multipart = "^0.0.30"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.27"
ruff = "^0.7"

[tool.poetry.scripts]
gradimize = "src.tui.app:main"
gradimize-api = "src.api.main:run_server"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
